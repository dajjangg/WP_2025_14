<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>사진 갤러리</title>
  <style>
    body { font-family: Arial; padding: 20px; }
    .gallery { display: flex; flex-wrap: wrap; gap: 16px; }
    .photo-card {
      width: 200px; border: 1px solid #ccc; padding: 10px;
      border-radius: 8px; background: #fafafa; cursor:pointer;
    }
    .photo-card img { width: 100%; border-radius: 6px; }

    /* 모달 스타일 */
    #modal {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      display: none; justify-content: center; align-items: center;
    }
    #modal-content {
      width: 400px; background: white; padding: 20px; border-radius: 10px;
    }
    #modal img { width: 100%; }
    #comments { margin-top: 15px; max-height: 200px; overflow-y: auto; }
    .comment { padding: 5px; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <h1>📸 사진 갤러리</h1>
  <div class="gallery" id="gallery"></div>

  <!-- 모달 -->
  <div id="modal">
    <div id="modal-content">
      <button onclick="closeModal()">닫기</button>
      <img id="modal-img" src="" />
      <p id="modal-caption"></p>

      <h3>댓글</h3>
      <div id="comments"></div>

      <h4>댓글 작성</h4>
      <input id="commentInput" type="text" placeholder="댓글 입력" style="width:100%;">
      <button id="commentBtn">등록</button>
    </div>
  </div>

  <script>
    async function loadPhotos() {
      const res = await fetch("/photo/");
      const data = await res.json();

      const gallery = document.getElementById("gallery");
      gallery.innerHTML = "";

      data.forEach(photo => {
        const card = document.createElement("div");
        card.className = "photo-card";

        card.innerHTML = `
          <img src="/uploads/${photo.image_path}" />
          <div class="caption">${photo.caption ?? "(캡션 없음)"}</div>
        `;

        card.addEventListener("click", () => openModal(photo));
        gallery.appendChild(card);
      });
    }

    // 모달 열기
    function openModal(photo) {
      document.getElementById("modal").style.display = "flex";
      document.getElementById("modal-img").src = `/uploads/${photo.image_path}`;
      document.getElementById("modal-caption").textContent = photo.caption;

      // 댓글 불러오기
      loadComments(photo.photo_id);

      // 댓글 등록 버튼
      document.getElementById("commentBtn").onclick = () => {
        addComment(photo.photo_id);
      };
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    // 댓글 불러오기
    async function loadComments(photo_id) {
      const res = await fetch(`/comment/${photo_id}`);
      const comments = await res.json();

      const commentsDiv = document.getElementById("comments");
      commentsDiv.innerHTML = "";

      comments.forEach(c => {
        commentsDiv.innerHTML += `
          <div class="comment">
            <b>${c.username}</b>: ${c.comment}
          </div>
        `;
      });
    }

    // 댓글 작성
    async function addComment(photo_id) {
      const input = document.getElementById("commentInput");
      const text = input.value.trim();
      if (text === "") return;

      const res = await fetch(`/comment/${photo_id}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ comment: text })
      });

      const data = await res.json();
      if (data.message) {
        input.value = "";
        loadComments(photo_id); // 댓글 즉시 새로고침
      }
    }

    loadPhotos();
  </script>
</body>
</html>
