<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>태그 검색</title>

  <style>

  * {
      box-sizing: border-box;
    }

    html, body {
      overflow-x: hidden;      }

    body {
      font-family: Arial;
      padding: 0;
      margin: 0;
      background: #f7f7f7;
    }

    /* 상단 네비게이션 */
    .navbar {
      width: 100%;
      background: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 10;

      flex-wrap: wrap;
    }

    .nav-left {
      font-size: 24px;
      font-weight: bold;
    }

    .nav-right {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;          /* 버튼 줄바꿈 */
      max-width: 100%;
      justify-content: flex-end;
      box-sizing: border-box;
      flex-shrink: 1;
      min-width: 0;
    }

    .nav-right button {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: white;
      cursor: pointer;
      transition: 0.2s;
    }

    .search-wrapper {
      width: 100%;
      max-width: 900px;
      margin: 40px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 검색창 */
    .search-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }

    .search-input {
      width: 85%;
      padding: 14px 20px;
      font-size: 18px;
      border: 2px solid #9b9b9b;
      border-radius: 12px;
      outline: none;
      transition: 0.2s ease;
    }
    .search-input:focus {
      border-color: #000000;
      box-shadow: 0 0 10px rgba(136, 211, 255, 0.5);
    }

    .search-btn {
      margin-left: -50px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 22px;
      color: #7bc2e0;
      font-weight: bold;
    }

    /* 카드 그리드 */
    .results-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 25px;
      padding-bottom: 40px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.1);
      transition: 0.25s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .card-title {
      font-weight: bold;
      font-size: 16px;
      color: #333;
      margin-bottom: 4px;
    }

    .card-tags {
      font-size: 13px;
      color: #888;
    }

    /* 안내 문구 */
    .placeholder-text {
      margin-top: 100px;
      font-size: 18px;
      color: #aaa;
    }

    .like-btn, .scrap-btn {
      border: none;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      padding: 6px 10px;
      margin: 2 0px;
      border-radius: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .like-btn:hover {
      background: #ffe5e5;
      color: #e74c3c; /* 빨간색 */
      transform: scale(1.05);
    }

    .scrap-btn:hover {
      background: #fff9d9;
      color: #f1c40f; /* 노란색 */
      transform: scale(1.05);
    }

    .like-btn span, .scrap-btn span {
      font-weight: bold;
    }
  </style>
</head>

<body>
  <!-- 네비게이션 -->
    <div class="navbar">
      <div class="nav-left">🍜 음식 갤러리</div>

      <div class="nav-right">
        <button onclick="goHome()">홈으로</button>
        <button onclick="goUpload()">게시물 업로드</button>
        <button onclick="goProfile()">내 프로필</button>
      </div>
    </div>
  <div class="search-wrapper">
    <!-- 검색창 -->
    <div class="search-bar">
      <input class="search-input" type="text" id="tagInput" placeholder="검색할 태그를 입력하세요. (예: 부산, 카페)" />
      <button class="search-btn" onclick="searchTags()">➜</button>
    </div>

    <!-- 검색 결과 -->
    <div id="resultGrid" class="results-grid"></div>

    <!-- 기본 안내 문구 -->
    <div id="placeholder" class="placeholder-text">
      🔍 태그를 검색하면 게시물이 이곳에 표시됩니다.
    </div>
  </div>

  <script>
    function goHome() { window.location.href = "/index.html"; }
    function goUpload() { window.location.href = "/upload.html"; }
    function goProfile() { window.location.href = "/profile.html"; }

    async function searchTags() {
      const keyword = document.getElementById("tagInput").value.trim();
      const grid = document.getElementById("resultGrid");
      const placeholder = document.getElementById("placeholder");

      grid.innerHTML = ""; // 기존 결과 삭제

      if (keyword === "") {
        placeholder.style.display = "block";
        return;
      }

      try {
        // API 호출 (백엔드: /search?q=부산 카페)
        const response = await fetch(`/search?q=${encodeURIComponent(keyword)}`);
        const posts = await response.json();

        if (!posts.length) {
          placeholder.style.display = "block";
          return;
        }

        placeholder.style.display = "none";

        // 결과 렌더링
        posts.forEach(post => {
          const card = `
            <div class="card">
              <img src="${post.image_path}" alt="post image" />
              <div class="card-title">${post.caption || "(제목 없음)"}</div>
              <div class="card-tags">#${post.tags ? post.tags.replace(/,/g, " #") : ""}</div>
              <div class="card-user">작성자: ${post.user_name}</div>
              <div class="card-meta">
                <button class="like-btn" onclick="toggleLike(${post.post_id}, event)">
                  ❤️ <span id="like-${post.post_id}">${post.likes_count}</span>
                </button>
                <button class="scrap-btn" onclick="toggleScrap(${post.post_id}, event)">
                  ⭐ <span id="scrap-${post.post_id}">${post.scraps_count}</span>
                </button>
              </div>
          `;
          grid.innerHTML += card;
        });
      } catch (err) {
        console.error("검색 오류:", err);
        placeholder.style.display = "block";
        placeholder.innerText = "⚠️ 검색 중 오류가 발생했습니다.";
      }
    }

    async function toggleLike(post_id, event) {
      event.stopPropagation(); // 카드 클릭 이벤트로 전파 막기
      const res = await fetch(`/like/${post_id}`, { method: "POST" });
      const data = await res.json();
      console.log(data);

      const countRes = await fetch(`/like/${post_id}/count`);
      const countData = await countRes.json();
      document.getElementById(`like-${post_id}`).innerText = countData.likeCount;
    }

    async function toggleScrap(post_id, event) {
      event.stopPropagation(); // 카드 클릭 이벤트로 전파 막기
      const res = await fetch(`/scrap/${post_id}`, { method: "POST" });
      const data = await res.json();
      console.log(data);

      const countRes = await fetch(`/scrap/${post_id}/count`);
      const countData = await countRes.json();
      document.getElementById(`scrap-${post_id}`).innerText = countData.scrapCount;
    }
  </script>
</body>
</html>
