<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>태그 검색</title>

  <style>

  * {
      box-sizing: border-box;
    }

    html, body {
      overflow-x: hidden;      }

    body {
      font-family: Arial;
      padding: 0;
      margin: 0;
      background: #f7f7f7;
    }

    /* 상단 네비게이션 */
    .navbar {
      width: 100%;
      background: white;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #ddd;
      position: sticky;
      top: 0;
      z-index: 10;

      flex-wrap: wrap;
    }

    .nav-left {
      font-size: 24px;
      font-weight: bold;
    }

    .nav-right {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;          /* 버튼 줄바꿈 */
      max-width: 100%;
      justify-content: flex-end;
      box-sizing: border-box;
      flex-shrink: 1;
      min-width: 0;
    }

    .nav-right button {
      padding: 6px 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
      background: white;
      cursor: pointer;
      transition: 0.2s;
    }

    .search-wrapper {
      width: 100%;
      max-width: 900px;
      margin: 40px auto;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* 검색창 */
    .search-bar {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;
    }

    .search-input {
      width: 85%;
      padding: 14px 20px;
      font-size: 18px;
      border: 2px solid #9b9b9b;
      border-radius: 12px;
      outline: none;
      transition: 0.2s ease;
    }
    .search-input:focus {
      border-color: #000000;
      box-shadow: 0 0 10px rgba(136, 211, 255, 0.5);
    }

    .search-btn {
      margin-left: -50px;
      border: none;
      background: none;
      cursor: pointer;
      font-size: 22px;
      color: #7bc2e0;
      font-weight: bold;
    }

    /* 카드 그리드 */
    .results-grid {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 25px;
      padding-bottom: 40px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 14px;
      box-shadow: 0 5px 14px rgba(0, 0, 0, 0.1);
      transition: 0.25s ease;
      cursor: pointer;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
    }

    .card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 10px;
    }

    .card-title {
      font-weight: bold;
      font-size: 16px;
      color: #333;
      margin-bottom: 4px;
    }

    .card-tags {
      font-size: 13px;
      color: #888;
    }

    .card-user {
        font-size: 14px; /* 글자 더 작게 */
        color: #555;
        margin-top: 4px;
      }

    /* 안내 문구 */
    .placeholder-text {
      margin-top: 100px;
      font-size: 18px;
      color: #aaa;
    }

    .like-btn, .scrap-btn {
      border: none;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      padding: 4px 6px;
      margin: 4px 0px;
      border-radius: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .like-btn:hover {
      background: #ffe5e5;
      color: #e74c3c; /* 빨간색 */
      transform: scale(1.05);
    }

    .scrap-btn:hover {
      background: #fff9d9;
      color: #f1c40f; /* 노란색 */
      transform: scale(1.05);
    }

    .like-btn span, .scrap-btn span {
      font-weight: bold;
    }

    .like-btn.active {
      background: #ffe5e5;
      color: #e74c3c;
    }

    .scrap-btn.active {
      background: #fff4c2;
      color: #f1c40f;
    }

    /* 모달 스타일 */
      #modal {
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        background: rgba(0,0,0,0.5);
        display: none; justify-content: center; align-items: center;
        overflow-y: hidden;
        padding: 40px 0;
      }

      #modal-content {
        width: 450px; max-height: 90vh; overflow-y: auto; background: white; 
        padding: 20px; border-radius: 10px; margin-top: 50px;
      }
      #modal-content button {
        padding: 6px 10px;
        border: 1px solid #ccc;
        background: white;
        border-radius: 6px;
        cursor: pointer;
        margin-bottom: 10px;
      }

      #modal-content button:hover {
        background: #eee;
      }
      #modal img { width: 100%; border-radius: 6px; }
      #comments { margin-top: 15px; max-height: 200px; overflow-y: auto; }
      .comment { padding: 5px; border-bottom: 1px solid #eee; }
      .info-label { font-weight: bold; margin-top: 10px; }
      .tags span {
        margin-right: 5px;
        color: #0077cc;
        font-weight: bold;
      }

      .tag-item {
        display: inline-block;
        background: #f0f7ff;
        color: #1a73e8;
        padding: 4px 10px;
        margin-right: 6px;
        margin-bottom: 6px;
        border-radius: 12px;
        font-size: 13px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }

      .tag-item:hover {
        background: #dbe9ff;
        transform: translateY(-2px);
      }

      #modal-content button.comment-btn {
        font-size: 11px;
        padding: 3px 6px;
        margin-left: 6px;
        margin-bottom: 0px;
        border: 1px solid #ccc;
        background: white;
        border-radius: 4px;
        cursor: pointer;
      }
      .comment-btn:hover {
        background: #eee;
      }
      #commentInput {
        margin-bottom: 10px;
      }

      
      /* 모달 전체 */
      #modal {
        display: none;
        justify-content: center;
        align-items: center;
        background: rgba(0,0,0,0.45);
        position: fixed;
        top: 0; left: 0;
        width: 100%; 
        height: 100%;
        padding: 30px 10px;
        z-index: 999;
      }

      /* 모달 박스 */
      #modal-content {
        width: 480px;
        background: #ffffff;
        border-radius: 18px;
        padding: 25px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        animation: modalFade 0.25s ease-out;
      }

      /* 등장 애니메이션 */
      @keyframes modalFade {
        from { opacity: 0; transform: translateY(20px); }
        to   { opacity: 1; transform: translateY(0px); }
      }

      /* 모달 이미지 */
      #modal-img {
        width: 100%;
        border-radius: 12px;
        margin-bottom: 18px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      }

      /* 항목 라벨 */
      .info-label {
        font-size: 14px;
        font-weight: 600;
        margin-top: 20px;
        margin-bottom: 5px;
        color: #444;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      /* 내용 텍스트 */
      #modal-content p {
        margin: 3px 0 10px 0;
        font-size: 15px;
        line-height: 1.5;
        color: #333;
      }

      /* 태그 스타일 */
      .tag-item {
        background: #eef4ff;
        padding: 6px 12px;
        font-size: 13px;
        border-radius: 12px;
        margin-right: 6px;
        margin-bottom: 6px;
        display: inline-block;
        cursor: pointer;
      }

      .tag-item:hover {
        background: #dbe9ff;
      }

      /* 댓글 영역 */
      #comments {
        margin-top: 15px;
        padding: 10px 14px;
        background: #fafafa;
        border-radius: 12px;
        max-height: 200px;
        overflow-y: auto;
        border: 1px solid #eee;
      }

      .comment {
        padding: 8px 0;
        border-bottom: 1px solid #ececec;
      }

      .comment:last-child {
        border-bottom: none;
      }

      /* 댓글 작성 */
      #commentInput {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid #ccc;
        margin-bottom: 10px;
      }

      #commentBtn {
        padding: 8px 14px;
        border-radius: 8px;
        background: #f7f7f7;
        border: 1px solid #ccc;
        cursor: pointer;
        transition: 0.2s;
      }

      #commentBtn:hover {
        background: #eee;
      }

      /* 닫기 버튼 */
      #modal-content > button:first-child {
        background: none;
        border: none;
        font-size: 16px;
        font-weight: bold;
        color: #333;
        cursor: pointer;
        float: right;
      } 
  </style>
</head>

<body>
  <!-- 네비게이션 -->
    <div class="navbar">
      <div class="nav-left">🍜 음식 갤러리</div>

      <div class="nav-right">
        <button onclick="goHome()">홈으로</button>
        <button onclick="goUpload()">게시물 업로드</button>
        <button onclick="goProfile()">내 프로필</button>
      </div>
    </div>
  <div class="search-wrapper">
    <!-- 검색창 -->
    <div class="search-bar">
      <input class="search-input" type="text" id="tagInput" placeholder="검색할 태그를 입력하세요. 여러 개 입력 시 공백으로 구분 (예: 부산 카페)" />
      <button class="search-btn" onclick="searchTags()">➜</button>
    </div>

    <!-- 검색 결과 -->
    <div id="resultGrid" class="results-grid"></div>

    <!-- 기본 안내 문구 -->
    <div id="placeholder" class="placeholder-text">
      🔍 태그를 검색하면 게시물이 이곳에 표시됩니다.
    </div>
  </div>

  <!-- 모달 -->
  <div id="modal">
    <div id="modal-content">
      <button onclick="closeModal()">닫기</button>

      <img id="modal-img" src="" />

      <p class="info-label">👤 작성자</p>
      <p id="modal-user"></p>

      <p class="info-label">📅 작성일</p>
      <p id="modal-date"></p>

      <p class="info-label">✏️ 캡션</p>
      <p id="modal-caption"></p>

      <p class="info-label">📝 설명</p>
      <p id="modal-description"></p>

      <p class="info-label">🏷 태그</p>
      <p id="modal-tags"></p>

      <p class="info-label">🍽 카테고리</p>
      <p id="modal-category"></p>

      <div class="modal-actions" style="margin-top: 10px; display:flex; gap:10px;">
        <button id="modal-like-btn" class="like-btn">❤️ <span id="modal-like-count"></span></button>
        <button id="modal-scrap-btn" class="scrap-btn">⭐ <span id="modal-scrap-count"></span></button>
      </div>

      <h3>댓글</h3>
      <div id="comments"></div>

      <h4>댓글 작성</h4>
      <input id="commentInput" type="text" placeholder="댓글 입력" style="width:100%;">
      <button id="commentBtn">등록</button>
    </div>
  </div>

  <script>
    let allPosts = [];

    let loggedInUserId = null;

    async function checkLoginStatus() {
      try {
        const res = await fetch("/auth/status", {
          credentials: "include" // 세션 쿠키 포함
        });

        const data = await res.json();

        if (data.loggedIn) {
          loggedInUserId = data.user_id;
        }
      } catch (err) {
        console.error("로그인 상태 확인 실패", err);
      }
    }

    checkLoginStatus();
    function goHome() { window.location.href = "/index.html"; }
    function goUpload() { 
      if (!loggedInUserId) {
        alert("로그인이 필요한 서비스입니다.");
        window.location.href = "/login.html";
        return;
      }
      window.location.href = "/upload.html";
    }
    function goProfile() {
      if (!loggedInUserId) {
        alert("로그인이 필요한 서비스입니다.");
        window.location.href = "/login.html";
        return;
      }
      window.location.href = `/profile.html?user_id=${loggedInUserId}`;
    }

     // 엔터키 입력 시 검색 실행
    document.getElementById("tagInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        event.preventDefault(); // 기본 form 제출 방지
        searchTags();
      }
    });

    async function searchTags() {
      const keyword = document.getElementById("tagInput").value.trim();
      const grid = document.getElementById("resultGrid");
      const placeholder = document.getElementById("placeholder");

      grid.innerHTML = ""; // 기존 결과 삭제

      if (keyword === "") {
        placeholder.style.display = "block";
        return;
      }

      try {
        // API 호출 (백엔드: /search?q=부산 카페)
        const response = await fetch(`/search?q=${encodeURIComponent(keyword)}`);
        const posts = await response.json();

        if (!posts.length) {
          placeholder.style.display = "block";
          placeholder.innerHTML = `❌ 검색한 태그를 포함하는 게시물이 존재하지 않습니다.`;
          return;
        }


        placeholder.style.display = "none";

        // 결과 렌더링
        posts.forEach(post => {
          // 1) DOM 요소 생성
          const card = document.createElement("div");
          card.className = "card";
          let tags = typeof post.tags === "string"
          ? post.tags.split(",").filter(t => t.trim() !== "")
          : [];

          // HTML 태그 문자열 생성
          let tagHtml = tags
          .map(t => `<span class="tag-item" onclick="searchByTag('${t}')">#${t}</span>`)
          .join("");

          // 2) 내부 HTML 삽입
          card.innerHTML = `
            <img src="${post.image_path}" alt="post image" />
            <div class="card-title">${post.caption || "(제목 없음)"}</div>
            <div class="card-tags">${tagHtml}</div>
            <div class="card-user">작성자: ${post.user_name}</div>

            <div class="card-meta">
              <button class="like-btn ${post.liked ? "active" : ""}" data-post-id="${post.post_id}" onclick="toggleLike(${post.post_id}, event)">
                ❤️ <span id="like-${post.post_id}">${post.likes_count}</span>
              </button>
              <button class="scrap-btn ${post.scrapped ? "active" : ""}" onclick="toggleScrap(${post.post_id}, event)">
                ⭐ <span id="scrap-${post.post_id}">${post.scraps_count}</span>
              </button>
            </div>
          `;

          // 3) 카드 클릭 시 모달 열기
          card.addEventListener("click", () => openModal(post));

          // 4) 그리드에 추가
          grid.appendChild(card);
        });

      } catch (err) {
        console.error("검색 오류:", err);
        placeholder.style.display = "block";
        placeholder.innerText = "⚠️ 검색 중 오류가 발생했습니다.";
      }
    }

    async function toggleLike(post_id, event) {
      event.stopPropagation(); // 카드 클릭 이벤트로 전파 막기
      if (!loggedInUserId) {
        alert("로그인이 필요한 기능입니다.");
        window.location.href = "/login.html";
        return;
      }
      const btn = event.currentTarget;
      const res = await fetch(`/like/${post_id}`, {
        method: "POST",
        credentials: "include"
      });
      const data = await res.json();
      console.log(data);
      btn.classList.toggle("active", data.liked);
      console.log(data.liked);


      const countRes = await fetch(`/like/${post_id}/count`);
      const countData = await countRes.json();
      const modalLike = document.querySelector(`#modal-like-${post_id}`);
      if (modalLike) modalLike.innerText = countData.likeCount;
      const listBtn = document.querySelector(`.like-btn[data-post-id="${post_id}"]`);
      const listCount = document.querySelector(`#like-${post_id}`);
      if (listBtn) listBtn.classList.toggle("active", data.liked);
      if (listCount) listCount.innerText = countData.likeCount;

      const target = allPosts.find(p => p.post_id === post_id);
        if (target) {
          target.liked = data.liked;
          target.likes_count = countData.likeCount;
      }
    }

    async function toggleScrap(post_id, event) {
      event.stopPropagation(); // 카드 클릭 이벤트로 전파 막기
      if (!loggedInUserId) {
        alert("로그인이 필요한 기능입니다.");
        window.location.href = "/login.html";
        return;
      }
      const btn = event.currentTarget;
      const res = await fetch(`/scrap/${post_id}`, {
        method: "POST",
        credentials: "include"
      });
      const data = await res.json();
      console.log(data);
      btn.classList.toggle("active", data.scrapped);

      const countRes = await fetch(`/scrap/${post_id}/count`);
      const countData = await countRes.json();

      const modalScrap = document.querySelector(`#modal-scrap-${post_id}`);
      if (modalScrap) modalScrap.innerText = countData.scrapCount;
      const listScrapBtn = document.querySelector(`.scrap-btn[data-post-id="${post_id}"]`);
      const listScrapCount = document.querySelector(`#scrap-${post_id}`);
      if (listScrapBtn) listScrapBtn.classList.toggle("active", data.scrapped);
      if (listScrapCount) listScrapCount.innerText = countData.scrapCount;

      const target = allPosts.find(p => p.post_id === post_id);
      if (target) {
        target.scrapped = data.scrapped;
        target.scraps_count = countData.scrapCount;
      }
    }

    // 모달 열기
    function openModal(post) {
      currentPostId = post.post_id;
      document.getElementById("modal").style.display = "flex";
      document.getElementById("modal-img").src = `/${post.image_path}`;
      document.getElementById("modal-caption").textContent = post.caption;
      document.getElementById("modal-description").textContent = post.description ?? "";
      document.getElementById("modal-category").textContent = post.category ?? "없음";
      document.getElementById("modal-user").textContent = post.user_name;
      const date = new Date(post.created_at).toLocaleString();
      document.getElementById("modal-date").textContent = date;
      // 좋아요 / 스크랩 버튼 상태 반영
        const modalLikeBtn = document.getElementById("modal-like-btn");
        const modalScrapBtn = document.getElementById("modal-scrap-btn");

        modalLikeBtn.classList.toggle("active", post.liked);
        modalScrapBtn.classList.toggle("active", post.scrapped);

        document.getElementById("modal-like-count").textContent = post.likes_count;
        document.getElementById("modal-scrap-count").textContent = post.scraps_count;

        // 버튼 클릭 이벤트 설정
        modalLikeBtn.onclick = (e) => toggleLikeInModal(post, e);
        modalScrapBtn.onclick = (e) => toggleScrapInModal(post, e);
      const tags = typeof post.tags === "string"
      ? post.tags.split(",").filter(t => t.trim() !== "")
      : [];

      const tagHtml = tags.map(t => `<span class="tag-item" onclick="searchByTag('${t}', event)">#${t}</span>`).join(" ");
      document.getElementById("modal-tags").innerHTML = tagHtml;

      // 댓글 불러오기
      loadComments(post.post_id, post.user_id);

      // 댓글 등록 버튼
      document.getElementById("commentBtn").onclick = () => {
        addComment(post.post_id);
      };
    }

    function closeModal() {
      document.getElementById("modal").style.display = "none";
    }

    async function toggleLikeInModal(post, event) {
      event.stopPropagation();
      if (!loggedInUserId) {
        alert("로그인이 필요합니다.");
        window.location.href = "/login.html";
        return;
      }

      const btn = document.getElementById("modal-like-btn");
      const res = await fetch(`/like/${post.post_id}`, {
        method: "POST",
        credentials: "include"
      });
      const data = await res.json();

      // 버튼 색 변경
      btn.classList.toggle("active", data.liked);

      // 최신 카운트 가져오기
      const countRes = await fetch(`/like/${post.post_id}/count`);
      const countData = await countRes.json();
      document.getElementById("modal-like-count").textContent = countData.likeCount;

      // 카드에서도 즉시 반영
      document.getElementById(`like-${post.post_id}`).textContent = countData.likeCount;

      // allPosts 배열 업데이트
      post.liked = data.liked;
      post.likes_count = countData.likeCount;
    }

    async function toggleScrapInModal(post, event) {
      event.stopPropagation();
      if (!loggedInUserId) {
        alert("로그인이 필요합니다.");
        window.location.href = "/login.html";
        return;
      }

      const btn = document.getElementById("modal-scrap-btn");
      const res = await fetch(`/scrap/${post.post_id}`, {
        method: "POST",
        credentials: "include"
      });
      const data = await res.json();

      // 버튼 색 변경
      btn.classList.toggle("active", data.scrapped);

      // 최신 카운트 가져오기
      const countRes = await fetch(`/scrap/${post.post_id}/count`);
      const countData = await countRes.json();
      document.getElementById("modal-scrap-count").textContent = countData.scrapCount;

      // 카드에서도 즉시 반영
      document.getElementById(`scrap-${post.post_id}`).textContent = countData.scrapCount;

      // allPosts 배열 업데이트
      post.scrapped = data.scrapped;
      post.scraps_count = countData.scrapCount;
    }

    // 댓글 불러오기
    async function loadComments(post_id, postOwnerId = loggedInUserId) {
      const res = await fetch(`/comment/${post_id}`);
      const comments = await res.json();

      const commentsDiv = document.getElementById("comments");
      commentsDiv.innerHTML = "";

      comments.forEach(c => {
        let btns = "";

        // 1) 댓글 작성자 == 로그인 사용자 → 수정/삭제 가능
        if (c.user_id === loggedInUserId) {
          btns = `
            <button class="comment-btn" onclick="editComment(${post_id}, ${postOwnerId}, ${c.comment_id}, '${c.comment.replace(/'/g, "\\'")}')">수정</button>
            <button class="comment-btn" onclick="deleteComment(${post_id}, ${postOwnerId}, ${c.comment_id})">삭제</button>
          `;
        }
        // 2) 게시물 작성자 == 로그인 사용자 → 모든 댓글 삭제 가능
        else if (postOwnerId === loggedInUserId) {
          btns = `
            <button class="comment-btn" onclick="deleteComment(${c.comment_id})">삭제</button>
          `;
        }

        commentsDiv.innerHTML += `
          <div class="comment">
            <b>${c.user_name}</b>: ${c.comment}
            ${btns}
          </div>
        `;
      });
    }

    async function searchByTag(tag) {
      event.stopPropagation();   // 카드 클릭 이벤트로 전파 막기!

      const input = document.getElementById("tagInput");
      input.value = tag;
      searchTags();     // 검색 실행
    }

    async function addComment(post_id) {
      const input = document.getElementById("commentInput");
      const text = input.value.trim();
      if (text === "") return;

      const res = await fetch(`/comment/${post_id}`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ comment: text })
      });

      const data = await res.json();
      if (data.message) {
        input.value = "";
        loadComments(post_id);
      }
    }
    window.onload = function () {
      const params = new URLSearchParams(window.location.search);
      const tag = params.get("tag");

      if (tag) {
        document.getElementById("tagInput").value = tag;
        searchTags();  // 자동 검색 실행
      }
    };

    async function editComment(post_id, postOwnerId, comment_id, oldText) {
      const newText = prompt("댓글 수정:", oldText);
      if (!newText) return;

      const res = await fetch(`/comment/${comment_id}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        credentials: "include",
        body: JSON.stringify({ comment: newText })
      });

      const data = await res.json();
      if (res.ok) {
        alert("댓글이 수정되었습니다.");
        loadComments(post_id, postOwnerId);
      } else {
        alert(data.message || "수정 실패");
      }
    };
    async function deleteComment(post_id, postOwnerId, comment_id) {
      if (!confirm("댓글을 삭제하시겠습니까?")) return;

      const res = await fetch(`/comment/${comment_id}`, {
        method: "DELETE",
        credentials: "include"
      });

      const data = await res.json();
      if (res.ok) {
        alert("댓글이 삭제되었습니다.");
        // 현재 보고있는 게시물 id 가져오기
        loadComments(post_id, postOwnerId);
      } else {
        alert(data.message || "삭제 실패");
      }
    };

    window.onload = function () {
      const params = new URLSearchParams(window.location.search);
      const tag = params.get("tag");

      if (tag) {
        document.getElementById("tagInput").value = tag;
        searchTags();  // 자동 검색 실행
      }
    };

  </script>

</body>
